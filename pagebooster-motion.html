<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagebooster Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,500;0,800;1,800&family=Inter:wght@500;800&display=swap" rel="stylesheet">
<style>
  /* Pagebooster huisstijl */
  :root{
    --bg:#0C0C0C;
    --lime:#DFF841;     /* logo */
    --paper:#F4F4F1;
    --grey:#CACAC8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}

  /* 9:16 stage */
  #stage{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));overflow:hidden;background:var(--bg);container-type:size}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block}
  #vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(100% 70% at 50% 55%,transparent 55%,rgba(0,0,0,.45) 100%)}

  /* Koppen per scène */
  .head{position:absolute;left:0;right:0;top:9cqh;text-align:center;color:var(--paper);pointer-events:none}
  .kicker{display:block;overflow:hidden;font-weight:800;font-size:2.7cqw;letter-spacing:.3em;color:var(--lime);text-transform:uppercase;margin-bottom:1.8cqw}
  .kicker span,.title span{display:inline-block;will-change:transform}
  .title{display:block;overflow:hidden;font-family:"Inter Tight","Inter",sans-serif;font-weight:800;font-size:10cqw;letter-spacing:-.045em;line-height:1.05;padding-bottom:.1em}
  .title em{font-style:normal;color:var(--lime)}

  /* Eindbeeld */
  #endline{position:absolute;left:0;right:0;top:57cqh;text-align:center;font-family:"Inter Tight","Inter",sans-serif;font-weight:800;font-size:6.2cqw;letter-spacing:-.045em;color:var(--paper);overflow:hidden;padding-bottom:.1em}
  #endline span{display:inline-block}
  #endline em{font-style:normal;color:var(--lime)}
  #endurl{position:absolute;left:0;right:0;bottom:8cqh;text-align:center;font-weight:800;font-size:2.8cqw;letter-spacing:.24em;color:var(--grey)}

  #play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;
    background:rgba(12,12,12,.55);backdrop-filter:blur(5px);cursor:pointer;border:0;font:inherit;color:var(--paper)}
  #play .btn{width:19cqw;height:19cqw;border-radius:50%;background:var(--lime);display:grid;place-items:center;box-shadow:0 0 8cqw rgba(223,248,65,.35)}
  #play .btn svg{width:6.5cqw;height:6.5cqw;margin-left:1cqw}
  #play small{font-weight:800;font-size:2.7cqw;letter-spacing:.24em;color:var(--grey)}
  #play.hidden{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="vignette"></div>

  <div class="head" id="h1"><span class="kicker"><span>01 — Ontwerp</span></span><span class="title"><span>Strak <em>ontworpen.</em></span></span></div>
  <div class="head" id="h2"><span class="kicker"><span>02 — Techniek</span></span><span class="title"><span>Slim <em>gebouwd.</em></span></span></div>
  <div class="head" id="h3"><span class="kicker"><span>03 — SEO</span></span><span class="title"><span>Bovenaan <em>in Google.</em></span></span></div>
  <div class="head" id="h4"><span class="kicker"><span>04 — Groei</span></span><span class="title"><span>Meer <em>klanten.</em></span></span></div>

  <div id="endline"><span>Websites die <em>werken.</em></span></div>
  <div id="endurl">PAGEBOOSTER.NL</div>

  <button id="play" aria-label="Afspelen">
    <span class="btn"><svg viewBox="0 0 24 24" fill="#0C0C0C"><path d="M6 4l14 8-14 8z"/></svg></span>
    <small>AFSPELEN MET GELUID</small>
  </button>
</div>

function rrShape(w, h, r){
  r = Math.min(r, w/2, h/2);
  const s = new THREE.Shape(), x = -w/2, y = -h/2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function rbox(w, h, d, r, material, {pivot = 'center'} = {}){
  const bev = Math.min(0.03, d*0.3, r*0.5);
  const g = new THREE.ExtrudeGeometry(rrShape(w - bev*2, h - bev*2, Math.max(r - bev, 0.001)),
    {depth: Math.max(d - bev*2, 0.001), bevelEnabled:true, bevelThickness:bev, bevelSize:bev, bevelSegments:3, curveSegments:10});
  g.center();
  if (pivot === 'bottom') g.translate(0, h/2, 0);
  const m = new THREE.Mesh(g, material);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
const place = (m, x, y, z, parent) => { m.position.set(x, y, z); parent.add(m); return m; };

const letters = LOGO.shapes.map(s => {
  const toV = p => new THREE.Vector2(p[0]*LOGO_W, -p[1]*LOGO_W);
  const shape = new THREE.Shape(s.o.map(toV));
  s.h.forEach(h => shape.holes.push(new THREE.Path(h.map(toV))));
  const g = new THREE.ExtrudeGeometry(shape, {depth:0.16, bevelEnabled:true, bevelThickness:0.025, bevelSize:0.012, bevelSegments:3, curveSegments:1});
  g.computeBoundingBox();
  const c = new THREE.Vector3(); g.boundingBox.getCenter(c); g.translate(-c.x, -c.y, -c.z);
  const m = new THREE.Mesh(g, [M.logo, M.limeDk]);
  m.castShadow = true;
  m.position.set(c.x - LOGO_W/2, c.y + LOGO.aspect*LOGO_W/2, 0);
  m.userData.home = m.position.clone();
  S5.add(m);
  return m;
});
// zachte lime gloed achter het logo

/* ───────────── camera-rig (lens-shift houdt de content onder de koppen) ───────────── */
const cam = {x:-0.6, y:0.9, z:13.5, tx:0, ty:0, tz:0, roll:0, shift:-0.07};
let vw = 1, vh = 1;
function applyCamera(){
  camera.position.set(cam.x, cam.y, cam.z);
  camera.up.set(Math.sin(cam.roll), Math.cos(cam.roll), 0);
  camera.lookAt(cam.tx, cam.ty, cam.tz);
  camera.setViewOffset(vw, vh, 0, vh*cam.shift, vw, vh);
  spot.position.set(cam.tx + 1.6, cam.ty + 7.5, cam.tz + 5.5);
  spot.target.position.set(cam.tx, cam.ty, cam.tz);
  fill.position.set(cam.tx - 6, cam.ty + 2, cam.tz + 3);
  fill.target.position.set(cam.tx, cam.ty, cam.tz);
}

/* ───────────── geluid (Web Audio, gesynthetiseerd) ───────────── */
let AC = null, out = null, verb = null, seeking = false;
function initAudio(){
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  out = AC.createGain(); out.gain.value = 0.55;
  const comp = AC.createDynamicsCompressor(); out.connect(comp); comp.connect(AC.destination);
  verb = AC.createConvolver();
  const len = AC.sampleRate * 1.8, ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++){ const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 3.2); }
  verb.buffer = ir;
  const vg = AC.createGain(); vg.gain.value = 0.25; verb.connect(vg); vg.connect(out);
}
const live = () => AC && !tl.paused() && !seeking;
function noiseBuf(sec){ const b = AC.createBuffer(1, AC.sampleRate*sec, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; return b; }
function env(g, t, peak, a, r){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + r); }
function send(n){ n.connect(out); n.connect(verb); }
const SFX = {
  whoosh(dur = 0.45, f0 = 300, f1 = 2400, vol = 0.2){
    if (!live()) return; const t = AC.currentTime;
    const src = AC.createBufferSource(); src.buffer = noiseBuf(dur + 0.1);
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur*0.7);
    const g = AC.createGain(); env(g, t, vol, dur*0.55, dur*0.45);
    src.connect(bp); bp.connect(g);
    if (AC.createStereoPanner){ const p = AC.createStereoPanner(); p.pan.setValueAtTime(-0.4, t); p.pan.linearRampToValueAtTime(0.4, t + dur); g.connect(p); send(p); } else send(g);
    src.start(t); src.stop(t + dur + 0.1);
  },
  tick(freq = 1400, vol = 0.06){
    if (!live()) return; const t = AC.currentTime;
    const o = AC.createOscillator(); o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq*0.6, t + 0.06);
    const g = AC.createGain(); env(g, t, vol, 0.003, 0.07);
    o.connect(g); send(g); o.start(t); o.stop(t + 0.1);
  },
  pop(vol = 0.13){
    if (!live()) return; const t = AC.currentTime;
    [880, 1318.5].forEach((f, i) => {
      const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      const g = AC.createGain(); env(g, t + i*0.06, vol, 0.005, 0.35);
      o.connect(g); send(g); o.start(t + i*0.06); o.stop(t + i*0.06 + 0.45);
    });
  },
  thump(vol = 0.35){
    if (!live()) return; const t = AC.currentTime;
    const o = AC.createOscillator(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.3);
    const g = AC.createGain(); env(g, t, vol, 0.005, 0.38);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.45);
  },
  chime(vol = 0.075){
    if (!live()) return; const t = AC.currentTime;
    [523.25, 659.25, 783.99, 1046.5, 1567.98].forEach((f, i) => ['sine', 'triangle'].forEach((type, k) => {
      const o = AC.createOscillator(); o.type = type; o.frequency.value = f * (k ? 1.002 : 1);
      const g = AC.createGain(); env(g, t + i*0.055, vol*(k ? 0.35 : 1), 0.01, 1.6 - i*0.15);
      o.connect(g); send(g); o.start(t + i*0.055); o.stop(t + 2);
    }));
  },
};

/* ───────────── tijdlijn ───────────── */
gsap.ticker.fps(FPS);
const tl = gsap.timeline({paused:true, defaults:{ease:'power3.out'}});
const ZERO = {x:0.001, y:0.001, z:0.001}, ONE = {x:1, y:1, z:1};

function headIn(id, t){
  tl.fromTo(`${id} .kicker span`, {yPercent:110}, {yPercent:0, duration:0.4, ease:'expo.out'}, t)
    .fromTo(`${id} .title span`, {yPercent:110}, {yPercent:0, duration:0.5, ease:'expo.out'}, t + 0.05);
}
function headOut(id, t){
  tl.to(`${id} .kicker span, ${id} .title span`, {yPercent:-110, duration:0.28, ease:'power3.in', stagger:0.025}, t);
}
gsap.set('.head .kicker span, .head .title span', {yPercent:110});
gsap.set('#endline span', {yPercent:110});
gsap.set('#endurl', {opacity:0, letterSpacing:'.6em'});

tl.fromTo(page.position, {x:-1.2, y:-0.6, z:-5}, {x:0, y:0, z:0, duration:0.9, ease:'expo.out'}, 0)
  .fromTo(page.rotation, {x:0.5, y:-1.1, z:0.12}, {x:0, y:0.18, z:0, duration:1.0, ease:'expo.out'}, 0)
  .to(page.rotation, {y:-0.12, duration:0.6, ease:'sine.inOut'}, 0.95);
els.forEach((m, i) => {
  const t = 0.32 + i*0.034;
  tl.fromTo(m.position, {z:1.8 + m.userData.layer*0.6}, {z:0.1, duration:0.45, ease:'back.out(1.6)'}, t)
    .fromTo(m.scale, ZERO, {...ONE, duration:0.35, ease:'back.out(1.8)'}, t);
  if (i % 3 === 0) tl.call(() => SFX.tick(1000 + i*45, 0.045), null, t + 0.12);
});
tl.fromTo(cam, {x:-0.6, y:0.9, z:13.5, tx:0, ty:0, tz:0, roll:-0.05}, {x:0.7, y:0.5, z:9.6, ty:-0.1, roll:0, duration:1.5, ease:'power2.out'}, 0);
headIn('#h1', 0.3);

// — Scène 2 (1.5 – 2.6): exploded view, camera draait eromheen
tl.call(() => SFX.whoosh(0.55, 120, 900, 0.18), null, 1.42);
headOut('#h1', 1.32);
tl.to(cam, {x:5.6, y:2.4, z:6.0, tx:0, ty:-0.1, tz:0.6, roll:0.03, duration:1.15, ease:'power2.inOut'}, 1.45);
tl.to(page.rotation, {y:0.05, x:0, duration:1.0, ease:'power2.inOut'}, 1.5);
els.forEach(m => tl.to(m.position, {z:0.1 + m.userData.layer*0.62, duration:0.7, ease:'power3.inOut'}, 1.55 + m.userData.layer*0.04));
tl.to(pageBase.position, {z:-0.25, duration:0.7, ease:'power3.inOut'}, 1.55);
headIn('#h2', 1.62);

// — overgang naar Scène 3 (2.6 – 3.1)
headOut('#h2', 2.42);
tl.call(() => SFX.whoosh(0.5, 400, 3200, 0.22), null, 2.6);
tl.to(cam, {x:S3X + 0.7, y:1.1, z:8.6, tx:S3X, ty:0.25, tz:0, roll:-0.02, duration:0.55, ease:'expo.inOut'}, 2.62);

// — Scène 3 (2.85 – 4.0): onze pagina klimt naar #1
tl.fromTo(search.scale, ZERO, {...ONE, duration:0.45, ease:'back.out(1.6)'}, 2.82);
tl.fromTo(typed.scale, {x:0.001}, {x:1, duration:0.35, ease:'steps(8)'}, 3.0)
  .fromTo(typed.position, {x:-0.9}, {x:-0.3, duration:0.35, ease:'steps(8)'}, 3.0)
  .fromTo(caret.position, {x:-0.9}, {x:0.34, duration:0.35, ease:'steps(8)'}, 3.0);
results.forEach((r, i) => {
  const t = 2.86 + i*0.05;
  tl.fromTo(r.rotation, {x:-1.4}, {x:0, duration:0.5, ease:'expo.out'}, t)
    .fromTo(r.position, {z:-1.2, y:SLOT(i) - 0.4}, {z:0, y:SLOT(i), duration:0.5, ease:'expo.out'}, t)
    .fromTo(r.scale, ZERO, {...ONE, duration:0.35}, t);
  tl.call(() => SFX.tick(1500 - i*90, 0.04), null, t + 0.05);
});
tl.call(() => SFX.whoosh(0.4, 600, 2600, 0.13), null, 3.22);
tl.to(ours.position, {z:0.7, duration:0.2, ease:'power2.out'}, 3.22)
  .to(ours.scale, {x:1.05, y:1.05, z:1.05, duration:0.2}, 3.22)
  .to(ours.position, {y:SLOT(0), duration:0.5, ease:'power3.inOut'}, 3.36);
results.slice(0, 4).forEach((r, i) => tl.to(r.position, {y:SLOT(i + 1), duration:0.42, ease:'power3.inOut'}, 3.4 + (3 - i)*0.03));
tl.to(ours.position, {z:0.18, duration:0.25, ease:'back.out(2)'}, 3.84)
  .to(ours.userData.badge.scale, {...ONE, duration:0.35, ease:'back.out(2.4)'}, 3.82)
  .call(() => SFX.pop(), null, 3.84);
tl.to(cam, {x:S3X - 0.9, y:0.4, z:8.0, ty:0.3, roll:0.02, duration:1.0, ease:'sine.inOut'}, 3.1);
headIn('#h3', 2.96);

// — overgang naar Scène 4 (3.98 – 4.45)
headOut('#h3', 3.95);
tl.call(() => SFX.whoosh(0.48, 350, 2800, 0.22), null, 3.98);
tl.to(cam, {x:S4X - 2.9, y:1.4, z:8.0, tx:S4X, ty:-0.05, tz:0, roll:0, duration:0.5, ease:'expo.inOut'}, 4.0);

// — Scène 4 (4.3 – 5.2): staven groeien, lime pijl schiet omhoog
bars.forEach((b, i) => {
  const t = 4.32 + i*0.07;
  tl.to(b.scale, {y:1, duration:0.6, ease:'expo.out'}, t);
  tl.call(() => SFX.tick(700 + i*170, 0.055), null, t);
});
tl.call(() => SFX.whoosh(0.6, 250, 4200, 0.12), null, 4.62);
tl.to(arrow, {v:1, duration:0.55, ease:'power2.inOut'}, 4.65);
tl.to(head.scale, {...ONE, duration:0.3, ease:'back.out(2.5)'}, 5.1);

// — overgang naar het logo (5.15 – 5.75)
headOut('#h4', 5.12);
tl.call(() => SFX.whoosh(0.7, 150, 3600, 0.24), null, 5.18);
tl.to(cam, {x:S5X, y:0.2, z:12.5, tx:S5X, ty:0.3, tz:0, roll:0, shift:0.0, duration:0.6, ease:'expo.inOut'}, 5.2);

// — Scène 5 (5.5 – 7.0): letters vliegen in, logo groot in beeld
letters.forEach((m, i) => {
  const t = 5.45 + i*0.035, h = m.userData.home;
  tl.fromTo(m.position, {x:h.x + 0.6, y:h.y - 0.5, z:2.2}, {x:h.x, y:h.y, z:0, duration:0.6, ease:'expo.out'}, t)
    .fromTo(m.rotation, {x:-1.3, y:0.5}, {x:0, y:0, duration:0.65, ease:'expo.out'}, t)
    .fromTo(m.scale, ZERO, {...ONE, duration:0.4, ease:'power3.out'}, t);
});
tl.call(() => { SFX.thump(0.3); SFX.chime(); }, null, 5.9);
tl.fromTo(S5.rotation, {y:-0.22, x:0.12}, {y:0.05, x:-0.03, duration:1.5, ease:'power2.out'}, 5.45);
tl.fromTo(sheen.position, {x:S5X - 3, y:0.5, z:1.1}, {x:S5X + 3, duration:0.9, ease:'power2.inOut'}, 5.95)
  .fromTo(sheen, {intensity:0}, {intensity:2, duration:0.3, yoyo:true, repeat:1, repeatDelay:0.3, ease:'sine.inOut'}, 5.95);
tl.to(cam, {z:10.3, y:0.1, duration:1.5, ease:'power2.out'}, 5.8);
tl.to(glow.material, {opacity:0.45, duration:0.8, ease:'power2.out'}, 5.85);
tl.to('#endline span', {yPercent:0, duration:0.55, ease:'expo.out'}, 6.15);
tl.to('#endurl', {opacity:1, letterSpacing:'.24em', duration:0.7, ease:'expo.out'}, 6.3);
tl.set({}, {}, DURATION);

/* ───────────── render ───────────── */
function resize(){
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  vw = r.width; vh = r.height;
}
addEventListener('resize', resize); resize();
function draw(){
  tubeGeo.setDrawRange(0, Math.floor(arrow.v * tubeCount / 6) * 6);
  applyCamera();
  renderer.render(scene, camera);
}
gsap.ticker.add(draw);

// Exportmodus voor frame-voor-frame capture (60 fps → 420 frames): window.renderFrame(n)
window.renderFrame = n => { seeking = true; tl.pause(); tl.seek(n / FPS, true); draw(); seeking = false; };
window.TOTAL_FRAMES = DURATION * FPS;

const play = document.getElementById('play');
function start(){ initAudio(); AC.resume(); play.classList.add('hidden'); tl.restart(); }
play.addEventListener('click', start);
tl.eventCallback('onComplete', () => setTimeout(() => { play.querySelector('small').textContent = 'OPNIEUW AFSPELEN'; play.classList.remove('hidden'); }, 900));
addEventListener('keydown', e => { if (e.code === 'Space' || e.key === 'r'){ e.preventDefault(); start(); } });

window.renderFrame(0);
})();
</script>
