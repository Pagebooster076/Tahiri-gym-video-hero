<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagebooster Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Pagebooster: lime uit het logo, op wit en zwart */
  :root{
    --bg:#070707;
    --lime:#DFF841;
    --paper:#F4F4F1;
    --grey:#9A9A94;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Outfit",system-ui,sans-serif}
  #stage{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));
    height:min(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px),calc(100vw*16/9));
    overflow:hidden;background:var(--bg);container-type:size}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block}
  #play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.4cqw;
    background:rgba(7,7,7,.45);backdrop-filter:blur(6px);cursor:pointer;border:0;font:inherit;color:var(--paper)}
  #play .btn{width:17cqw;height:17cqw;border-radius:50%;background:var(--lime);display:grid;place-items:center;box-shadow:0 0 12cqw rgba(223,248,65,.35)}
  #play .btn svg{width:5.4cqw;height:5.4cqw;margin-left:.8cqw}
  #play small{font-family:"Geist Mono",ui-monospace,monospace;font-weight:500;font-size:2.3cqw;letter-spacing:.34em;color:var(--grey)}
  #play:focus-visible .btn{outline:2px solid var(--lime);outline-offset:6px}
  #play.hidden{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <button id="play" aria-label="Afspelen">
    <span class="btn"><svg viewBox="0 0 24 24" fill="#070707"><path d="M6 4l14 8-14 8z"/></svg></span>
    <small>AFSPELEN MET GELUID</small>
  </button>
</div>

/* ───────────── canvas-helpers: tekst en UI als scherpe texturen in 3D ───────────── */
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };
function tex(c){
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = ANISO;
  t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true;
  return t;
}
function plane(c, ppu, o = {}){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(c.width/ppu, c.height/ppu),
    new THREE.MeshBasicMaterial(Object.assign({map:tex(c), transparent:true, alphaTest:0.01, toneMapped:false, depthWrite:true}, o)));
  m.userData.w = c.width/ppu; m.userData.h = c.height/ppu;
  return m;
}
function rr(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function setFont(ctx, px, weight, family = FONT, ls = -0.03){ ctx.font = `${weight} ${px}px ${family}`; if ('letterSpacing' in ctx) ctx.letterSpacing = `${(ls*px).toFixed(1)}px`; }
// tekst met meerdere kleuren/gewichten: runs = [[tekst, kleur, gewicht], ...]
function textCanvas(runs, px, {family = FONT, ls = -0.035} = {}){
  const pad = Math.round(px*0.3), m = mkCanvas(8, 8).getContext('2d');
  const widths = runs.map(([t, , w]) => { setFont(m, px, w, family, ls); return m.measureText(t).width; });
  const c = mkCanvas(widths.reduce((a, b) => a + b, 0) + pad*2, px*1.32 + pad*2), ctx = c.getContext('2d');
  let x = pad;
  runs.forEach(([t, col, w], i) => { setFont(ctx, px, w, family, ls); ctx.fillStyle = col; ctx.textBaseline = 'alphabetic'; ctx.fillText(t, x, pad + px*1.0); x += widths[i]; });
  return c;
}
const PPU = 900;   // pixels per wereld-eenheid voor tekst
function word(t, col, size, weight = 700, ppu = PPU){ return plane(textCanvas([[t, col, weight]], size*ppu), ppu); }
// een regel losse woorden, gecentreerd rond x = 0
function wordLine(parent, items, size, y, ppu){
  const meshes = items.map(([t, col, w, p]) => word(t, col, size, w, p || ppu));
  const pad = size*0.3*2, gap = size*0.24;
  const widths = meshes.map(m => m.userData.w - pad);
  let x = -(widths.reduce((a, b) => a + b, 0) + gap*(meshes.length - 1))/2;
  meshes.forEach((m, i) => { m.position.set(x + widths[i]/2, y, 0); m.userData.home = m.position.clone(); x += widths[i] + gap; parent.add(m); });
  return meshes;
}
// canvas die alleen opnieuw tekent als de staat verandert
function live(w, h, ppu, draw){
  const c = mkCanvas(w, h), ctx = c.getContext('2d'), m = plane(c, ppu);
  let last = null;
  m.userData.update = state => { const k = JSON.stringify(state); if (k === last) return; last = k; ctx.clearRect(0, 0, w, h); draw(ctx, state, w, h); m.material.map.needsUpdate = true; };
  return m;
}

      pad(t, freqs, dur, v = 0.026){ const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(650, t); lp.frequency.linearRampToValueAtTime(1500, t + dur);
        const g = gain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.2); g.gain.setValueAtTime(v, t + dur - 0.1); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.5);
        lp.connect(g); both(g);
        freqs.forEach(f => [-7, 7].forEach(c => { const o = osc('sawtooth', f, t, dur + 0.6); o.detune.value = c; const og = gain(); og.gain.value = 0.22; o.connect(og); og.connect(lp); })); },
      whoosh(t, dur, f0, f1, v){ [[1, 1.1], [0.5, 2.4]].forEach(([m, q], k) => {
        const s = ctx.createBufferSource(); s.buffer = nb; const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q;
        bp.frequency.setValueAtTime(f0*m, t); bp.frequency.exponentialRampToValueAtTime(f1*m, t + dur*0.7);
        const g = gain(); env(g, t, v*(k ? 0.6 : 1), dur*0.55, dur*0.45); s.connect(bp); bp.connect(g);
        if (ctx.createStereoPanner){ const p = ctx.createStereoPanner(); p.pan.setValueAtTime(k ? 0.5 : -0.5, t); p.pan.linearRampToValueAtTime(k ? -0.5 : 0.5, t + dur); g.connect(p); both(p); } else both(g);
        s.start(t, Math.random(), dur + 0.1); }); },
      word(t){ const n = noise(t, 0.07, 'bandpass', 3200, 1.4), g = gain(); env(g, t, 0.05, 0.003, 0.05); n.connect(g); both(g); },
      key(t){ const n = noise(t, 0.035, 'highpass', 2400 + Math.random()*1500), g = gain(); env(g, t, 0.045, 0.002, 0.025); n.connect(g); dry(g); },
      click(t){ [0, 0.07].forEach((d, i) => { const o = osc('square', i ? 1800 : 2600, t + d, 0.05); const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4000;
        const g = gain(); env(g, t + d, 0.045, 0.001, 0.025); o.connect(lp); lp.connect(g); both(g); }); },
      tick(t, f = 1500, v = 0.03){ const o = osc('sine', f, t, 0.08); o.frequency.exponentialRampToValueAtTime(f*0.6, t + 0.05); const g = gain(); env(g, t, v, 0.002, 0.05); o.connect(g); both(g); },
      pop(t){ [880, 1318.5].forEach((f, i) => { const o = osc('triangle', f, t + i*0.06, 0.5), g = gain(); env(g, t + i*0.06, 0.09, 0.005, 0.4); o.connect(g); both(g); }); },
      boom(t, v = 0.14){ const o = osc('sine', 90, t, 0.7); o.frequency.exponentialRampToValueAtTime(38, t + 0.5); const g = gain(); env(g, t, v, 0.01, 0.6); o.connect(g); dry(g); },
      riser(t, dur, v){ const s = ctx.createBufferSource(); s.buffer = nb; const hp = ctx.createBiquadFilter(); hp.type = 'highpass';
        hp.frequency.setValueAtTime(800, t); hp.frequency.exponentialRampToValueAtTime(8000, t + dur);
        const g = gain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + dur*0.97); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.03);
        s.connect(hp); hp.connect(g); both(g); s.start(t, 0, dur + 0.05); },
      impact(t){ S.kick(t, 0.4); S.boom(t, 0.3);
        const n = noise(t, 1.6, 'lowpass', 6000), g = gain(); env(g, t, 0.07, 0.005, 1.4); n.connect(g); both(g);
        [349.23, 440, 523.25, 698.46, 880, 1046.5].forEach((f, i) => ['sine', 'triangle'].forEach((ty, k) => {
          const o = osc(ty, f*(k ? 1.003 : 1), t + i*0.035, 2.8), gg = gain(); env(gg, t + i*0.035, k ? 0.018 : 0.045, 0.01, 2.4 - i*0.2); o.connect(gg); both(gg); })); },
    };
    // muziek: Dm – Bb – F, kick op de tel, hats op de achtertel, stilte vóór de impact op tel 12
    const prog = [[73.42, [146.83, 174.61, 220]], [58.27, [116.54, 146.83, 174.61]], [87.31, [174.61, 220, 261.63]]];
    for (let i = 0; i <= 10; i++){
      const t = t0 + i*BEAT, bar = prog[Math.min(2, Math.floor(i/4))];
      S.kick(t, i % 4 === 0 ? 0.22 : 0.16); S.hat(t + BEAT/2); if (i < 10) S.hat(t + BEAT*0.75, 0.011);
      S.bass(t, bar[0], BEAT*0.85);
    }
    prog.forEach(([, ch], k) => S.pad(t0 + k*4*BEAT, ch, 4*BEAT));
    S.pad(t0 + 12*BEAT, [174.61, 220, 261.63, 349.23], 1.9, 0.03);
    CUES.forEach(([t, name, ...args]) => S[name](t0 + t, ...args));
    return {stop(){ bus.disconnect(); wet.disconnect(); }};
  };
}
// offline render (voor export naar MP4): geeft een WAV als base64
window.renderAudio = async () => {
  const sr = 48000, oc = new OfflineAudioContext(2, Math.ceil(sr*(DURATION + 0.6)), sr);
  buildAudio(oc)(0);
  const buf = await oc.startRendering(), n = buf.length, L = buf.getChannelData(0), R = buf.getChannelData(1);
  const dv = new DataView(new ArrayBuffer(44 + n*4)), str = (o, s) => [...s].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); dv.setUint32(4, 36 + n*4, true); str(8, 'WAVEfmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr*4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); str(36, 'data'); dv.setUint32(40, n*4, true);
  for (let i = 0; i < n; i++){ dv.setInt16(44 + i*4, Math.max(-1, Math.min(1, L[i]))*32767, true); dv.setInt16(46 + i*4, Math.max(-1, Math.min(1, R[i]))*32767, true); }
  let bin = ''; const u8 = new Uint8Array(dv.buffer); for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(bin);
};

function resize(){
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  const W = Math.round(r.width*DPR), H = Math.round(r.height*DPR);
  [rtBase, rtDof, rtH1, rtH2, rtQ1, rtQ2, rtB1, rtB2, rtC1, rtC2, rtK1, rtK2].forEach(rt => rt && rt.dispose());
  rtBase = mkRT(W, H, true); rtDof = mkRT(W, H);
  rtH1 = mkRT(W >> 1, H >> 1); rtH2 = mkRT(W >> 1, H >> 1); rtQ1 = mkRT(W >> 2, H >> 2); rtQ2 = mkRT(W >> 2, H >> 2);
  rtB1 = mkRT(W >> 1, H >> 1); rtB2 = mkRT(W >> 1, H >> 1); rtC1 = mkRT(W >> 2, H >> 2); rtC2 = mkRT(W >> 2, H >> 2);
  rtK1 = mkRT(W >> 2, H >> 2); rtK2 = mkRT(W >> 2, H >> 2); rtK1.texture.encoding = rtK2.texture.encoding = THREE.LinearEncoding;
  finalMat.uniforms.uRes.value.set(W, H);
}
addEventListener('resize', resize); resize();
function draw(){
  const time = tl.time();
  searchUI.userData.update({n:Math.floor(typing.n), caret:typing.n < QUERY.length ? 1 : Math.floor(time*3.2) % 2});
  card.userData.update({v:Math.round(counter.v), p:Math.round(counter.p*240)/240});
  pixels.forEach(m => { const b = m.userData.base; m.position.y = b.y + Math.sin(time*m.userData.sp + b.x*3)*0.06; m.rotation.z = time*m.userData.sp*0.4; });
  bgMat.uniforms.uDark.value = look.dark; bgMat.uniforms.uTime.value = time;
  dotMat.uniforms.uWave.value = look.wave; dotMat.uniforms.uRing.value = look.ring;
  applyCamera(time);

  renderer.setRenderTarget(rtBase); renderer.render(scene, camera);
  // scherptediepte
  down(rtBase, rtH1); blur(rtH1, rtH2, 1.2);
  down(rtH1, rtQ1); blur(rtQ1, rtQ2, 1.6); blur(rtQ1, rtQ2, 2.4);
  const focus = camera.position.distanceTo(tgt) + look.focus, cu = cocMat.uniforms, du = dofMat.uniforms;
  cu.tD.value = rtBase.depthTexture; cu.uFocus.value = focus; cu.uRange.value = look.range;
  pass(cocMat, rtK1); blur(rtK1, rtK2, 1.5); blur(rtK1, rtK2, 2.5);
  du.tS.value = rtBase.texture; du.tH.value = rtH1.texture; du.tQ.value = rtQ1.texture; du.tD.value = rtBase.depthTexture; du.tK.value = rtK1.texture;
  du.uFocus.value = focus; du.uRange.value = look.range;
  pass(dofMat, rtDof);
  // bloom (alleen in donkere scènes)
  brightMat.uniforms.t.value = rtDof.texture; pass(brightMat, rtB1); blur(rtB1, rtB2, 1.0);
  down(rtB1, rtC1); blur(rtC1, rtC2, 1.6); blur(rtC1, rtC2, 2.6);
  const u = finalMat.uniforms;
  u.tBase.value = rtDof.texture; u.tB1.value = rtB1.texture; u.tB2.value = rtC1.texture;
  u.uTime.value = Math.round(time*FPS); u.uBlur.value = look.blur; u.uBloom.value = look.bloom;
  u.uDark.value = look.dark; u.uFlash.value = look.flash; u.uWipe.value = look.wipe;
  pass(finalMat, null);
}

}
