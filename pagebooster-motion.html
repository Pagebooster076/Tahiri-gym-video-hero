<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagebooster Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Pagebooster: lime op zwart (kleuren uit het logo) */
  :root{
    --bg:#0A0A0A;
    --lime:#DFF841;
    --paper:#F4F4F1;
    --grey:#9A9A94;
    --font:"Geist","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--font)}

  /* 9:16 stage */
  #stage{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));
    height:min(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px),calc(100vw*16/9));
    overflow:hidden;background:var(--bg);container-type:size}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* Koppen per scène */
  .head{position:absolute;left:0;right:0;top:9.5cqh;text-align:center;color:var(--paper);pointer-events:none}
  .kicker{display:flex;align-items:center;justify-content:center;gap:2.2cqw;font-family:var(--mono);font-weight:500;font-size:2.3cqw;letter-spacing:.32em;text-transform:uppercase;color:var(--grey);margin-bottom:2.6cqw}
  .kicker b{font-weight:500;color:var(--lime)}
  .kicker i{display:block;width:6cqw;height:1px;background:var(--grey);opacity:.6;transform-origin:left}
  .title{display:block;font-weight:600;font-size:9.4cqw;letter-spacing:-.05em;line-height:1.05;padding:0 .05em .08em}
  .title em{font-style:normal;font-weight:300;color:var(--lime)}
  .c{display:inline-block;white-space:pre;will-change:transform,filter,opacity}

  /* Eindbeeld */
  #endline{position:absolute;left:0;right:0;top:57.5cqh;text-align:center;font-weight:300;font-size:5.4cqw;letter-spacing:-.03em;color:var(--paper)}
  #endline em{font-style:normal;font-weight:600;color:var(--lime)}
  #endurl{position:absolute;left:0;right:0;bottom:7.5cqh;display:flex;align-items:center;justify-content:center;gap:2.4cqw;font-family:var(--mono);font-weight:500;font-size:2.3cqw;letter-spacing:.34em;color:var(--grey)}
  #endurl i{display:block;width:5cqw;height:1px;background:var(--lime)}

  #play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.4cqw;
    background:rgba(10,10,10,.5);backdrop-filter:blur(6px);cursor:pointer;border:0;font:inherit;color:var(--paper)}
  #play .btn{width:17cqw;height:17cqw;border-radius:50%;border:1px solid rgba(223,248,65,.6);display:grid;place-items:center;box-shadow:0 0 10cqw rgba(223,248,65,.18), inset 0 0 4cqw rgba(223,248,65,.12)}
  #play .btn svg{width:5cqw;height:5cqw;margin-left:.8cqw}
  #play small{font-family:var(--mono);font-weight:500;font-size:2.3cqw;letter-spacing:.34em;color:var(--grey)}
  #play:focus-visible .btn{outline:2px solid var(--lime);outline-offset:6px}
  #play.hidden{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>

  <div class="head" id="h1"><div class="kicker"><b>01</b><i></i><span>Ontwerp</span></div><span class="title">Strak <em>ontworpen.</em></span></div>
  <div class="head" id="h2"><div class="kicker"><b>02</b><i></i><span>Techniek</span></div><span class="title">Slim <em>gebouwd.</em></span></div>
  <div class="head" id="h3"><div class="kicker"><b>03</b><i></i><span>SEO</span></div><span class="title">Bovenaan <em>in Google.</em></span></div>
  <div class="head" id="h4"><div class="kicker"><b>04</b><i></i><span>Groei</span></div><span class="title">Meer <em>klanten.</em></span></div>

  <div id="endline"><span class="title-end">Websites die <em>werken.</em></span></div>
  <div id="endurl"><i></i><span>PAGEBOOSTER.NL</span><i></i></div>

  <button id="play" aria-label="Afspelen">
    <span class="btn"><svg viewBox="0 0 24 24" fill="#DFF841"><path d="M6 4l14 8-14 8z"/></svg></span>
    <small>AFSPELEN MET GELUID</small>
  </button>
</div>

function rrShape(w, h, r){
  r = Math.min(r, w/2, h/2);
  const s = new THREE.Shape(), x = -w/2, y = -h/2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function rbox(w, h, d, r, material, {pivot = 'center'} = {}){
  const bev = Math.min(0.035, d*0.35, r*0.5);
  const g = new THREE.ExtrudeGeometry(rrShape(w - bev*2, h - bev*2, Math.max(r - bev, 0.001)),
    {depth: Math.max(d - bev*2, 0.001), bevelEnabled:true, bevelThickness:bev, bevelSize:bev, bevelSegments:4, curveSegments:12});
  g.center();
  if (pivot === 'bottom') g.translate(0, h/2, 0);
  const m = new THREE.Mesh(g, material);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

  uniform sampler2D t; uniform vec2 dir; varying vec2 vUv;

    c += (texture2D(t, vUv + dir*1.3846).rgb + texture2D(t, vUv - dir*1.3846).rgb)*0.3162;
    c += (texture2D(t, vUv + dir*3.2308).rgb + texture2D(t, vUv - dir*3.2308).rgb)*0.0703;
    gl_FragColor = vec4(c, 1.); }`});
const post = {blur:0, bloom:1};
const compMat = new THREE.ShaderMaterial({vertexShader:VS,
  uniforms:{tBase:{value:null}, tB1:{value:null}, tB2:{value:null}, uTime:{value:0}, uBlur:{value:0}, uBloom:{value:1}, uRes:{value:new THREE.Vector2(1, 1)}},
  fragmentShader:`
  uniform sampler2D tBase, tB1, tB2; uniform float uTime, uBlur, uBloom; uniform vec2 uRes; varying vec2 vUv;
  void main(){

  tl.to(b.scale, {y:1, duration:0.65, ease:'expo.out'}, t);
  tl.call(() => SFX.tick(700 + i*170, 0.045), null, t);
});
tl.call(() => SFX.whoosh(0.6, 250, 4200, 0.1), null, 4.62);
tl.to(arrow, {v:1, duration:0.55, ease:'power2.inOut'}, 4.65);
tl.to(head.scale, {...ONE, duration:0.3, ease:'back.out(2.2)'}, 5.1);
tl.to(cam, {x:S4X + 2.3, y:0.4, z:7.4, ty:0.5, duration:1.0, ease:'sine.inOut'}, 4.45);
headIn('#h4', 4.3);

// — overgang naar het logo (5.2 – 5.8)
headOut('#h4', 5.1);
tl.call(() => { SFX.whoosh(0.7, 150, 3600, 0.2); SFX.riser(0.68, 0.08); }, null, 5.2);
tl.to(cam, {x:S5X, y:0.2, z:12.5, tx:S5X, ty:0.3, tz:0, roll:0, shift:0.0, duration:0.6, ease:'expo.inOut'}, 5.2);
whip(5.2, 0.6);

// — Scène 5 (5.45 – 7.0): letters vliegen in, logo groot in beeld
letters.forEach((m, i) => {
  const t = 5.45 + i*0.035, h = m.userData.home;
  tl.fromTo(m.position, {x:h.x + 0.6, y:h.y - 0.5, z:2.2}, {x:h.x, y:h.y, z:0, duration:0.65, ease:'expo.out'}, t)
    .fromTo(m.rotation, {x:-1.3, y:0.5}, {x:0, y:0, duration:0.7, ease:'expo.out'}, t)
    .fromTo(m.scale, ZERO, {...ONE, duration:0.45, ease:'power3.out'}, t);
});
tl.call(() => SFX.impact(), null, 5.88);
tl.fromTo(post, {bloom:1}, {bloom:1.9, duration:0.12, ease:'power2.out'}, 5.88).to(post, {bloom:1.15, duration:0.9, ease:'power2.out'}, 6.0);
tl.fromTo(S5.rotation, {y:-0.22, x:0.12}, {y:0.05, x:-0.03, duration:1.55, ease:'power2.out'}, 5.45);
tl.fromTo(sheen.position, {x:S5X - 3, y:0.5, z:1.1}, {x:S5X + 3, duration:0.95, ease:'power2.inOut'}, 5.95)
  .fromTo(sheen, {intensity:0}, {intensity:2.2, duration:0.3, yoyo:true, repeat:1, repeatDelay:0.35, ease:'sine.inOut'}, 5.95);
tl.to(cam, {z:10.3, y:0.1, duration:1.5, ease:'power2.out'}, 5.8);
tl.to('#endline .c', {opacity:1, yPercent:0, filter:'blur(0px)', duration:0.6, ease:'expo.out', stagger:0.015}, 6.1);
tl.fromTo('#endurl', {opacity:0, letterSpacing:'.7em'}, {opacity:1, letterSpacing:'.34em', duration:0.8, ease:'expo.out'}, 6.3);
tl.set({}, {}, DURATION);

/* ───────────── render ───────────── */
function resize(){
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  vw = r.width; vh = r.height;
  const W = Math.round(r.width*DPR), H = Math.round(r.height*DPR);
  rtBase.setSize(W, H);
  rtA.setSize(W >> 1, H >> 1); rtB.setSize(W >> 1, H >> 1);
  rtC.setSize(W >> 2, H >> 2); rtD.setSize(W >> 2, H >> 2);
  compMat.uniforms.uRes.value.set(W, H);
}
addEventListener('resize', resize); resize();
function draw(){
  const time = tl.time();
  tubeGeo.setDrawRange(0, Math.floor(arrow.v * tubeCount / 6) * 6);
  dust.position.set(time*0.06, Math.sin(time*0.5)*0.05, 0);
  applyCamera(time);
  renderer.setRenderTarget(rtBase);
  renderer.render(scene, camera);
  // bloom: helderste (vooral lime) delen, op halve en kwart resolutie
  brightMat.uniforms.t.value = rtBase.texture; pass(brightMat, rtA);
  blur(rtA, rtB, 1.0);
  blurMat.uniforms.t.value = rtA.texture; blurMat.uniforms.dir.value.set(0, 0); pass(blurMat, rtC);
  blur(rtC, rtD, 1.6);
  blur(rtC, rtD, 2.4);
  const u = compMat.uniforms;
  u.tBase.value = rtBase.texture; u.tB1.value = rtA.texture; u.tB2.value = rtC.texture;
  u.uTime.value = Math.round(time*FPS);
  u.uBlur.value = post.blur; u.uBloom.value = post.bloom;
  pass(compMat, null);
}
gsap.ticker.add(draw);

// Exportmodus voor frame-voor-frame capture (60 fps → 420 frames): window.renderFrame(n)
window.renderFrame = n => { seeking = true; tl.pause(); tl.seek(n / FPS, true); draw(); seeking = false; };
window.TOTAL_FRAMES = DURATION * FPS;

const play = document.getElementById('play');
function start(){ initAudio(); AC.resume(); play.classList.add('hidden'); tl.restart(); }
play.addEventListener('click', start);
tl.eventCallback('onComplete', () => setTimeout(() => { play.querySelector('small').textContent = 'OPNIEUW AFSPELEN'; play.classList.remove('hidden'); }, 900));
addEventListener('keydown', e => { if (e.code === 'Space' || e.key === 'r'){ e.preventDefault(); start(); } });

window.renderFrame(0);
})();
</script>
